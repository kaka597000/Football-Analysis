name: PR32 bounded asset recovery
on:
  push:
    branches: [research/elo-kelly-config-20261112]
    paths: [.github/workflows/pr32-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retained research packages
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          out=pathlib.Path('/tmp/pr32-research');out.mkdir()
          repo='kaka597000/kaka597000-Football-Analysis-Data';ref='9a7bb55ce149a5b7bc9a4a9684ac160f964c83d7'
          base='https://raw.githubusercontent.com/'+repo+'/'+ref+'/'
          def get(url):
              with urllib.request.urlopen(url,timeout=90) as r:return r.read()
          receipts=[]
          for name in ['20261105-remaining-nine-market','20261105-nine-items']:
              prefix='workspace-updates/'+name+'/';folder=out/name;folder.mkdir()
              raw=get(base+prefix+'manifest.json');m=json.loads(raw);(folder/'manifest.json').write_bytes(raw)
              h=hashlib.sha256()
              with (folder/'research.tar.gz').open('xb') as f:
                  for p in m['ordered_parts']:
                      b=get(base+prefix+p['path'])
                      if len(b)!=p['bytes'] or hashlib.sha256(b).hexdigest()!=p['sha256']:raise ValueError('part hash mismatch')
                      f.write(b);h.update(b)
              if h.hexdigest()!=m['archive_sha256']:raise ValueError('archive mismatch')
              (folder/'files.json').write_bytes(get(base+prefix+'files.json'))
              (folder/'README.md').write_bytes(get(base+prefix+'README.md'))
              receipts.append({'name':name,'archive_sha256':h.hexdigest()})
          prefix='workspace-updates/20261110-four-cohort-refresh/'
          folder=out/'four-cohort';folder.mkdir()
          for name in ['delivery.json','evidence-manifest.json','protocol.json','summary.json','research-evidence.tar.gz']:
              b=get(base+prefix+name);(folder/name).write_bytes(b)
              receipts.append({'name':prefix+name,'download_sha256':hashlib.sha256(b).hexdigest()})
          tree=json.loads(get('https://api.github.com/repos/'+repo+'/git/trees/'+ref+'?recursive=1'))
          for item in tree['tree']:
              if item['path'].startswith('.github/workflows/') and item['type']=='blob':
                  b=get(base+item['path']);p=out/'workflows'/pathlib.PurePosixPath(item['path']).name;p.parent.mkdir(exist_ok=True);p.write_bytes(b)
          (out/'receipts.json').write_text(json.dumps({'data_commit':ref,'packages':receipts,'active_modified':False},indent=2))
          print('Retained packages verified; no new provider download or active model modification')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr32-retained-research
          path: /tmp/pr32-research
          retention-days: 1
          if-no-files-found: error
