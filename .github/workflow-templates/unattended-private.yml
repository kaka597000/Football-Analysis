# Installed only in the private data repository. No secrets or cross-repo token.
name: WCPP private unattended research
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, train]
        default: collect
  schedule:
    - cron: '17 */6 * * *'
    - cron: '37 2 * * *'
permissions:
  contents: write
concurrency:
  group: wcpp-private-research-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: private-state
      - name: Read pinned public code
        uses: actions/checkout@v4
        with:
          repository: kaka597000/Football-Analysis
          ref: __WCPP_CODE_REF__
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select bounded job
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE_SPEC: ${{ github.event.schedule }}
        run: |
          mode=collect
          if [ "$REQUESTED_MODE" = train ] || [ "$SCHEDULE_SPEC" = '37 2 * * *' ]; then mode=train; fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - name: Install CPU training dependencies
        if: steps.mode.outputs.value == 'train'
        run: python -m pip install -r code/requirements.txt lightgbm==4.6.0
      - name: Collect or train candidate only
        working-directory: code
        env:
          JOB_MODE: ${{ steps.mode.outputs.value }}
        run: python -m runtime.automation.run "$JOB_MODE" --state-dir ../private-state --max-collection-seconds 150
      - name: Save private audit and data
        if: always()
        working-directory: private-state
        run: |
          git config user.name 'WCPP automation'
          git config user.email 'wcpp-automation@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Update private research state'
            git push origin HEAD:main
          fi
