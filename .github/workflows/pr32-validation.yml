name: Durable retained J1 recovery
on:
  workflow_dispatch:
  push:
    branches: [feat/post32-runtime-validation-20261112]
    paths:
      - .github/workflows/pr32-validation.yml
      - scripts/restore_retained_catalog.py
      - scripts/predict_retained_j1.py
permissions:
  contents: read
jobs:
  retained:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaka597000/kaka597000-Football-Analysis-Data
          ref: 0a39464455376a650c7f8778a5f40aba39b41044
          path: durable-data
          sparse-checkout: workspace-updates/20261112-post32
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Fresh recovery from immutable repository archives
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
          mkdir /tmp/retained-results
          python scripts/restore_retained_catalog.py --catalog durable-data/workspace-updates/20261112-post32/recovery-catalog.json --workspace /workspace --cache /tmp/retained-cache --receipt /tmp/retained-results/restore.json
          ln -s "$GITHUB_WORKSPACE" /workspace/Football-Analysis
          python scripts/build_retained_j1_manifest.py --current-artifact /workspace/WCPP/reports/japan-korea-20261010/jpn.1-artifact.json --test-artifact /workspace/WCPP/models/systematic-20261015-final-extended-003/jpn.1/artifact.json --source-root /workspace/WCPP/runtime/retained-j1/source/runtime --evidence-dir /workspace/WCPP/reports/japan-korea-20261010/j1-history-summaries --source-commit b6242ba06ec8e23b1613bb9ed32397f6ebad0987 --out /tmp/retained-results/j1-compatibility.json
      - name: Real artifacts and sandbox failure handling (synthetic fixture)
        run: python scripts/verify_pr32_retained.py smoke --out /tmp/retained-results
      - name: Recovery and publication regressions
        env:
          PYTHONPATH: runtime
        run: python -m unittest runtime.test_durable_recovery runtime.test_publication_recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-j1-recovery-receipt
          path: /tmp/retained-results
          retention-days: 90
          if-no-files-found: error
